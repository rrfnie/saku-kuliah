name: Build SakuKuliah APK 🌸

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub

permissions:
  contents: write

jobs:
  build:
    name: Rakit APK Android Super Ringan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bersihkan & Unduh Dependensi
        run: |
          flutter clean
          flutter pub get

      - name: Rakit APK Android
        run: |
          flutter build apk --release --android-skip-build-dependency-validation > build_out.txt 2>&1 || (echo "=== GRADLE FAILURE LOG ===" && tail -n 120 build_out.txt && exit 1)

      - name: Upload Berkas APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: SakuKuliah-APK-Android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Rilis APK Langsung (Direct Download)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-b${{ github.run_number }}
          name: "SakuKuliah v1.0.0 (Build ${{ github.run_number }}) 🌸"
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ### SakuKuliah APK Siap Install di HP 🌸✨
            - 🎨 **5 Palet Tema Pastel Aesthetic:** Blush Sakura 🌸, Matcha Latte 🍵, Lilac Dream 💜, Baby Blue Sky ☁️, Warm Caramel ☕.
            - 🌙 **Cozy Midnight Dark Mode:** Teks kontras tinggi dan jernih, bebas silau.
            - 📱 **Responsif & Anti-Kepotong:** Perbaikan header jadwal, IPK, transkrip KHS, dan deadline tugas.
            - ⚡ **Offline-first & Tanpa Login:** Data aman 100% tersimpan di HP.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Log Jika Gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-build-log
          path: build_out.txt
          retention-days: 7

      - name: Simpan Log ke Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          cp build_out.txt latest_error.log
          git add latest_error.log
          git commit -m "chore: save latest build error log" || true
          git push origin build-logs --force
