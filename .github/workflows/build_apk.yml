name: Build SakuKuliah APK 🌸

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub

jobs:
  build:
    name: Rakit APK Android Super Ringan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bersihkan & Unduh Dependensi
        run: |
          flutter clean
          flutter pub get

      - name: Rakit APK Android
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Berkas APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: SakuKuliah-APK-Android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
